[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pathology-measures"
version = "0.1.0"
description = "Reference implementations of H&E histology measurements (tissue composition, Gleason pattern share, gland morphometry, nuclei, texture) mapped to the pathology atlas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-image>=0.22"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pathology_measures*"]
