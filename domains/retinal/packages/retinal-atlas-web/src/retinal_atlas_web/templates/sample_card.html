<a class="sample-card" href="{{ s.path }}"><div class="thumbnail"><img src="{{ url_for('sample_image', alias=s.image) }}" alt="{{ s.alt }}" loading="lazy" width="{{ s.width }}" height="{{ s.height }}"></div><div class="card-copy"><span class="category">{{ '해부 구조' if s.section == 'anatomy' else '병변' }} · {{ s.tags[1:] | join(' · ') }}</span><h2>{{ s.label }}</h2><p>{{ s.description }}</p><span class="link-label">상세 보기</span></div></a>
