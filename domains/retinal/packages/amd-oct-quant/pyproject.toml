[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amd-oct-quant"
version = "0.2.1"
description = "Reusable deterministic AMD OCT mask decoding and quantitative phenotype metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "Pillow>=11",
  "pyarrow>=18",
  "PyYAML>=6",
  "scipy>=1.14",
  "scikit-learn>=1.4",
]

[project.scripts]
amd-oct-quant = "amd_oct_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["amd_oct_quant*"]
